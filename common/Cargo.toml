[package]
name = "common"
version = "0.0.0"
edition = "2024"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
axum-prometheus = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = { workspace = true, optional = true }
mockall = { workspace = true }
mongodb = { workspace = true }
once_cell = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true }
rsa = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
auth = ["dep:jsonwebtoken", "dep:prometheus", "dep:once_cell"]
integration-tests = []
test-utils = ["auth", "dep:rsa", "dep:rand"]

[dev-dependencies]
tower = { workspace = true }

[package.metadata.cargo-machete]
# rsa/rand are used only under the `test-utils` feature (auth_mock.rs +
# RSA keygen); cargo-machete cannot see feature-gated usage.
ignored = ["rsa", "rand"]
