[workspace]
members = [
    "citadel",
    "barbican",
    "common",
]
resolver = "3"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8.8", features = ["macros"] }
axum-prometheus = "0.10.0"
axum-test = "18.7.0"
chrono = { version = "0.4", features = ["serde"] }
common = { path = "common" }
futures = "0.3"
futures-util = "0.3"
base64 = "0.22"
hex = "0.4"
jsonwebtoken = "9.3"
jwks = "0.4"
k8s-openapi = { version = "0.21", features = ["v1_28"] }
kube = { version = "0.88", features = ["runtime", "client"] }
maplit = "1.0"
mockall = "0.13"
mongodb = "3.5.1"
nix = { version = "0.29", features = ["fs"] }
notify = "5.0"
once_cell = "1.21"
prometheus = "0.13"
rand = "0.9"
reqwest = { version = "0.12", features = ["json"] }
rsa = "0.9"
serde = "1.0.228"
serde-aux = "4.7.0"
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.0"
thiserror = "2.0"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
tower = "0.5"
tower-governor = { package = "tower_governor", version = "0.5" }
tower-http = { version = "0.6.8", features = ["cors", "metrics", "catch-panic", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
