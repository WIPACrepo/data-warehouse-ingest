[workspace]
members = [
    "citadel",
    "barbican",
    "common",
]
resolver = "3"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8.8", features = ["macros"] }
thiserror = "2.0"
axum-prometheus = "0.10.0"
axum-test = "18.7.0"
chrono = { version = "0.4", features = ["serde"] }
mockall = "0.13"
mongodb = "3.5.1"
serde = "1.0.228"
serde-aux = "4.7.0"
serde_json = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6.8", features = ["cors", "metrics", "catch-panic", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
common = { path = "common" }
