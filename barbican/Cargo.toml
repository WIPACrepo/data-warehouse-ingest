[package]
name = "barbican"
version = "0.0.0"
edition = "2024"

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
common = { workspace = true, features = ["auth"] }
futures = { workspace = true }
mongodb = { workspace = true }
prometheus = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }
mockall = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }

[features]
default = []
integration-tests = []
# Brings in common's test-utils (RSA keys + mock builders) for Barbican's
# unit tests. Barbican's own `test_utils` module is `#[cfg(test)]`-gated, so
# the production binary does not need `common/test-utils` (P4.7). Run
# `cargo test -p barbican --features test-utils` (also folded into the
# `test-integration` alias invocation for barbican in CI).
test-utils = ["common/test-utils"]
