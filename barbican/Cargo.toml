[package]
name = "barbican"
version = "0.0.0"
edition = "2024"

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
common = { workspace = true, features = ["auth"] }
futures = { workspace = true }
mongodb = { workspace = true }
prometheus = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum-test = { workspace = true }
# `common` is also a normal dependency (with `auth` only). Declaring it again
# as a dev-dependency with `test-utils` makes Cargo unify the features during
# test compilation, so `cargo test -p barbican` (and workspace/CI test runs)
# compile Barbican's unit tests — which use `common::test_utils`
# builders + `common::MockInboxStore` — WITHOUT requiring an explicit
# `--features test-utils`. The normal dependency (auth only) keeps the
# test-only crates (`rsa`, `base64`, `mockall`) out of the production build
# (P4.7); the dev-dependency is stripped from non-test builds. Citadel uses
# the same pattern.
common = { workspace = true, features = ["test-utils"] }
mockall = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }

[features]
default = []
integration-tests = []
